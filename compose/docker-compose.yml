# DO NOT EDIT
# The .env file has everything you need to edit.

services:
  proxy:
    image: ghcr.io/steve192/opencookbook-proxy:${tag}
    restart: always
    ports:
      - ${httpPort}:80
    environment:
      - DEBUG_MODE=${DEBUG_MODE}
      # Becomes client_max_body_size. The backend gets the same number below.
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-30}
    depends_on:
      - backend
      - frontend

  frontend:
    image: ghcr.io/steve192/opencookbook-frontend:${tag}
    restart: always
    environment:
      - LANDING_ENABLED=${LANDING_ENABLED:-false}

  recipe-scrapers:
    image: ghcr.io/steve192/recipe-scrapers-webservice:latest
    restart: always

  backend:
    image: ghcr.io/steve192/opencookbook-apiserver:${tag}
    restart: always
    depends_on:
      - recipe-scrapers
      - postgres
    environment:
      - DEBUG_MODE=${DEBUG_MODE}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_USERNAME=${DB_USERNAME}
      - DB_URI=${DB_URI}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_PROTOCOL=${SMTP_PROTOCOL}
      - SMTP_STARTTLS=${SMTP_STARTTLS}
      - MAIL_FROM=${MAIL_FROM}
      - INSTANCE_URL=${INSTANCE_URL}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-30}
      - MAX_IMAGE_SIZE_MB=${MAX_IMAGE_SIZE_MB:-10}
      - OPENCOOKBOOK_AUTH_GOOGLE_CLIENTID=${GOOGLE_CLIENT_ID}
      - OPENCOOKBOOK_AUTH_GOOGLE_ANDROIDCLIENTID=${GOOGLE_ANDROID_CLIENT_ID}
      # ML Subsystem (experimental not published yet)
      - OPENCOOKBOOK_ML_SERVICEURL=${ML_SERVICE_URL}
      - OPENCOOKBOOK_ML_APITOKEN=${ML_API_TOKEN}
      - OPENCOOKBOOK_ML_SUBMITTERSALT=${ML_SUBMITTER_SALT}
      - OPENCOOKBOOK_ML_REQUESTTIMEOUTSECONDS=${ML_REQUEST_TIMEOUT_SECONDS:-30}
      - OPENCOOKBOOK_ML_JOBTIMEOUTSECONDS=${ML_JOB_TIMEOUT_SECONDS:-300}
      - OPENCOOKBOOK_ML_JOBRETENTIONHOURS=${ML_JOB_RETENTION_HOURS:-24}
      - OPENCOOKBOOK_ML_RECIPEOCR_ENABLED=${ML_RECIPE_OCR_ENABLED:-true}
      - OPENCOOKBOOK_ML_RECIPEOCR_JOBSPERUSERPERDAY=${ML_JOBS_PER_USER_PER_DAY:-20}
      - OPENCOOKBOOK_ML_RECIPEOCR_MAXPAGES=${ML_MAX_PAGES:-6}
    volumes:
      - ${LEGAL_DIR:-./legal}:/opencookbook/legal:ro
      - ${IMAGES_MOUNT_DIR}:/opencookbook/recipe-images
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=cookpal
    volumes:
      - ${DATABASE_MOUNT_DIR}/postgres:/var/lib/postgresql/data
